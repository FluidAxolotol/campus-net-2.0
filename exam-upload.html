<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上传真题 · 校内网 2.0 学习版</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <style>
    /* ============================================================
       基础
       ============================================================ */
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ============================================================
       顶部导航
       ============================================================ */
    .nav {
      height: var(--nav-h);
      background: var(--card);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 32px;
      gap: 26px;
    }

    .nav .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      color: var(--ink);
      text-decoration: none;
    }

    .logo .mark {
      width: 28px;
      height: 28px;
      border-radius: var(--r-sm);
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .nav a {
      color: var(--ink-2);
      text-decoration: none;
    }

    .nav a.on {
      color: var(--brand);
      font-weight: 600;
    }

    /* 这页没有搜索框，用 margin-left:auto 把学校按钮推到最右 */
    .school {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 13px;
      line-height: inherit;
      color: var(--ink-2);
      cursor: pointer;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: var(--r-pill);
      background: var(--card);
      margin-left: auto;
    }

    /* ============================================================
       页面布局
       ============================================================ */
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 32px 64px;
    }

    .crumb {
      font-size: 12px;
      color: var(--ink-3);
      margin-bottom: 12px;
    }

    .crumb a {
      color: var(--brand);
      text-decoration: none;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 26px 30px;
    }

    .panel h1 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    /* ============================================================
       表单
       ============================================================ */
    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .field label .req {
      color: var(--danger);
    }

    .field input,
    .field select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 0 14px;
      font-size: 13.5px;
      outline: none;
      background: #fff;
    }

    /* :focus 伪类：输入时的边框颜色 */
    .field input:focus,
    .field select:focus {
      border-color: var(--brand);
    }

    .hint {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 4px;
    }

    /* 文件拖拽区：用 label 关联隐藏的 file input */
    .drop {
      display: block;
      border: 2px dashed var(--line);
      border-radius: var(--r-md);
      padding: 28px;
      text-align: center;
      color: var(--ink-3);
      font-size: 13px;
      cursor: pointer;
      background: #FAFBFC;
    }

    .drop b {
      color: var(--brand);
    }

    .drop .drop-sub {
      font-size: 11.5px;
    }

    /* 两列表单行：Grid 1fr 1fr */
    .frow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* ============================================================
       AI 识别结果
       ============================================================ */
    .aibox {
      margin-top: 20px;
      border: 1px solid #D9D4F5;
      border-radius: var(--r-md);
      padding: 16px 18px;
      background: #FAF9FF;
    }

    .aibox .h {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: #534AB7;
      margin: 0 0 8px;
    }

    .aibox .hint {
      color: #7C6FD0;
    }

    .kv {
      display: flex;
      gap: 10px;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px dashed #E4E0F3;
    }

    .kv:last-child {
      border-bottom: none;
    }

    .kv .k {
      flex: 0 0 90px;
      color: var(--ink-3);
    }

    .kv .v {
      flex: 1;
      font-weight: 600;
    }

    .kv .edit {
      font-size: 11px;
      color: var(--brand);
      cursor: pointer;
    }

    /* ============================================================
       操作按钮
       ============================================================ */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    .actions .ghost {
      flex: 1;
      height: 44px;
      border-radius: var(--r-md);
      border: 1px solid var(--line);
      background: #fff;
      font-size: 14px;
      color: var(--ink-2);
      cursor: pointer;
    }

    .actions .primary {
      flex: 2;
      height: 44px;
      border-radius: var(--r-md);
      border: none;
      background: var(--brand);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ===== 顶部导航 ===== -->
  <header class="site-header">
    <nav class="nav" aria-label="主导航">
      <a class="logo" href="index.html">
        <span class="mark" aria-hidden="true">校</span>
        校内网 2.0
      </a>
      <a href="index.html">首页</a>
      <a href="app-center.html">应用中心</a>
      <a href="exam-lib.html" class="on">真题库</a>
      <a href="community.html">校园社区</a>
      <button class="school" type="button">🏫 中山大学 ▾</button>
    </nav>
  </header>

  <!-- ===== 表单页主体 ===== -->
  <main class="wrap">

    <nav class="crumb" aria-label="面包屑">
      <a href="exam-lib.html">真题库</a> / 上传真题
    </nav>

    <form class="panel" action="#" method="get">
      <h1>⬆ 上传真题</h1>

      <div class="field">
        <label for="file">文件 <span class="req">*</span></label>
        <!-- 真正的文件选择框隐藏起来，由下面的 label 触发 -->
        <input type="file" id="file" hidden>
        <label class="drop" for="file">
          📎 点击选择或拖拽文件到这里<br>
          <span class="drop-sub">支持 PDF / JPG / PNG，单个不超过 20MB</span><br><br>
          <b>数据结构_2025春_期末.pdf</b>（2.1 MB）✓ 已选择
        </label>
      </div>

      <div class="frow">
        <div class="field">
          <label for="subject">科目 <span class="req">*</span></label>
          <select id="subject">
            <option>数据结构</option>
          </select>
        </div>
        <div class="field">
          <label for="term">学期 <span class="req">*</span></label>
          <select id="term">
            <option>2025 春</option>
          </select>
        </div>
      </div>

      <div class="frow">
        <div class="field">
          <label for="exam-type">考试类型</label>
          <select id="exam-type">
            <option>期末</option>
          </select>
        </div>
        <div class="field">
          <label for="has-answer">是否含答案</label>
          <select id="has-answer">
            <option>含答案</option>
          </select>
        </div>
      </div>

      <section class="aibox" aria-labelledby="ai-title">
        <h2 id="ai-title" class="h">✨ AI 已自动识别以下信息，请确认</h2>
        <div class="kv">
          <span class="k">科目</span>
          <span class="v">数据结构</span>
          <span class="edit">✏️ 修改</span>
        </div>
        <div class="kv">
          <span class="k">年份/学期</span>
          <span class="v">2025 春（识别自卷头）</span>
          <span class="edit">✏️ 修改</span>
        </div>
        <div class="kv">
          <span class="k">题量</span>
          <span class="v">5 大题 · 22 小题</span>
          <span class="edit">✏️ 修改</span>
        </div>
        <div class="hint">🤖 识别基于卷面内容，如有误请手动修正——你的确认会让下一届同学搜得更准</div>
      </section>

      <div class="actions">
        <button class="ghost" type="button">取消</button>
        <button class="primary" type="submit">提交审核</button>
      </div>

      <div class="hint">管理员将在 48 小时内完成审核；审核通过后对全校可见，并自动建立内容索引（支持 AI 问答）。</div>
    </form>

  </main>

</body>
</html>

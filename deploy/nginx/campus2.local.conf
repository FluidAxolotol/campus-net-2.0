# ============================================================
# 本地 Nginx（Linux / macOS / WSL）
# 用法示例：
#   nginx -c /绝对路径/deploy/nginx/campus2.local.conf
# 需要把 root 改成你本机仓库的 web/ 绝对路径；
# 如果只想快速跑起来，推荐 docker compose（见 README）。
# ============================================================

worker_processes 1;
error_log /tmp/campus2-nginx-error.log warn;
pid /tmp/campus2-nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    log_format trace '$remote_addr "$request" $status '
                     'req_time=$request_time upstream_time=$upstream_response_time '
                     'req_id=$request_id';
    access_log /tmp/campus2-nginx-access.log trace;

    server {
        listen 8088;
        server_name localhost;

        # 改成你本机仓库的 web/ 目录
        root /srv/campus2.0/current/web;
        index index.html;

        # 20MB 文件 + multipart 边界/字段开销，留 1MB 余量
        client_max_body_size 21m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self'" always;

        # 开发时静态资源不缓存，改完刷新立即生效
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "no-store";
        }

        # 动态请求转给 Express
        location /api/ {
            proxy_pass http://127.0.0.1:3100;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 60s;
        }

        # 上传文件不在 web 根目录；internal 只允许 X-Accel-Redirect 命中
        location /__files/ {
            internal;
            alias /srv/campus2.0/shared/uploads/;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

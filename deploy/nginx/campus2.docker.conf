# ============================================================
# Docker Compose 内的 Nginx：静态直出 + /api 反代 + 内部文件
# 容器内 API 主机名是 api:3100
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传 20MB 真题时，multipart 还有边界与字段开销，留 1MB 余量
    client_max_body_size 21m;

    # Nginx 直接返回静态页，因此安全头也要在入口配置
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # 本地调试不要缓存静态资源，改完刷新立即生效
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # 文件不放在 web 根目录；只有 Express 鉴权后返回 X-Accel-Redirect 才能命中
    location /__files/ {
        internal;
        alias /srv/campus2/uploads/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ============================================================
# 生产 Nginx 配置模板
# 80 只做 301 跳 HTTPS；443 终止 TLS、静态直出、反代 API、
# 内部文件下载由 X-Accel-Redirect 命中 /__files/。
# 证书路径、域名、root 要按真实环境替换。
# ============================================================

worker_processes auto;
error_log /var/log/nginx/campus2-error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    log_format trace '$remote_addr "$request" $status '
                     'req_time=$request_time upstream_time=$upstream_response_time '
                     'upstream_status=$upstream_status req_id=$request_id';
    access_log /var/log/nginx/campus2-access.log trace;

    upstream campus_api {
        server 127.0.0.1:3100;
        keepalive 16;
    }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name campus.example.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS 唯一入口
    server {
        listen 443 ssl;
        http2 on;
        server_name campus.example.com;

        ssl_certificate     /etc/letsencrypt/live/campus.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/campus.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self'" always;

        root /srv/campus2.0/current/web;
        index index.html;

        # 与 Express/multer 的 21MB 上限对齐
        client_max_body_size 21m;

        # 生产静态资源缓存 1 小时（发布后可通过文件名版本或刷新缓存失效）
        location /assets/ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location /api/ {
            proxy_pass http://campus_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 60s;
        }

        # 真实文件在 shared/uploads，不在 web 根目录；internal 阻止外部直达
        location /__files/ {
            internal;
            alias /srv/campus2.0/shared/uploads/;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

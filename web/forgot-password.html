<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>忘记密码 · 校内网 2.0 学习版</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <style>
    /* ============================================================
       基础：整页垂直水平居中
       ============================================================ */
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       卡片
       ============================================================ */
    .card {
      width: 400px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 36px 40px;
      box-shadow: var(--shadow);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
      justify-content: center;
      margin-bottom: 6px;
    }

    .logo .mark {
      width: 32px;
      height: 32px;
      border-radius: var(--r-sm);
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .sub {
      text-align: center;
      color: var(--ink-3);
      font-size: 12.5px;
      margin-bottom: 22px;
    }

    /* ============================================================
       步骤条
       ============================================================ */
    .steps {
      display: flex;
      gap: 0;
      margin: 0 0 24px;
      padding: 0;
      list-style: none;
    }

    .step {
      flex: 1;
      text-align: center;
      font-size: 11px;
      color: var(--ink-3);
      position: relative;
    }

    .step .dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--line);
      color: var(--ink-3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .step.on .dot {
      background: var(--brand);
      color: #fff;
    }

    .step.done .dot {
      background: var(--brand-soft);
      color: var(--brand);
    }

    .step.on {
      color: var(--brand);
      font-weight: 600;
    }

    /* ============================================================
       表单字段
       ============================================================ */
    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      color: var(--ink-2);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      background: #fff;
      box-sizing: border-box;
      font-family: inherit;
      color: var(--ink);
    }

    .field textarea {
      height: 80px;
      padding: 10px 14px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--brand);
    }

    /* 只读字段 */
    .field .ro {
      background: var(--bg);
      color: var(--ink-2);
    }

    /* 验证码行 */
    .vrow {
      display: flex;
      gap: 10px;
    }

    .vrow input {
      flex: 1;
    }

    .vbtn {
      height: 44px;
      padding: 0 16px;
      border: 1px solid var(--brand);
      border-radius: var(--r-md);
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ============================================================
       按钮
       ============================================================ */
    .btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: var(--r-md);
      background: var(--brand);
      color: #fff;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink-2);
      margin-top: 10px;
      font-weight: 400;
    }

    .alt {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--ink-2);
    }

    .alt a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="logo">
      <span class="mark" aria-hidden="true">校</span>
      校内网 2.0
    </div>
    <div class="sub">找回密码</div>

    <!-- 演示版不接邮件服务，改为提交申请给管理员 -->
    <ol class="steps" aria-label="找回密码步骤">
      <li class="step on" aria-current="step">
        <div class="dot">1</div>
        提交申请
      </li>
      <li class="step">
        <div class="dot">2</div>
        管理员核实
      </li>
      <li class="step">
        <div class="dot">3</div>
        领取临时密码
      </li>
    </ol>

    <form id="reset-form" action="#" novalidate>
      <div class="field">
        <label for="school">学校</label>
        <select id="school">
          <option value="">正在加载学校…</option>
        </select>
      </div>

      <div class="field">
        <label for="account">学号 / 校园邮箱</label>
        <input id="account" type="text" autocomplete="username" placeholder="输入注册时使用的学号或邮箱">
      </div>

      <div class="field">
        <label for="note">补充说明（可选）</label>
        <textarea id="note" placeholder="例如：换了手机号、原邮箱停用等，方便管理员核实"></textarea>
      </div>

      <div id="reset-error" class="form-message form-message-error" hidden></div>
      <div id="reset-success" class="form-message form-message-success" hidden></div>

      <button class="btn" id="reset-btn" type="submit">提交找回申请</button>
    </form>

    <div class="alt">想起来了？<a href="login.html">直接登录</a></div>
    <div class="alt" style="margin-top:8px;font-size:11.5px;color:var(--ink-3);">
      演示版不发送邮件，管理员处理后会生成临时密码，需线下转交。
    </div>
  </main>

  <script type="module" src="assets/js/pages/forgot-password.js"></script>
</body>
</html>

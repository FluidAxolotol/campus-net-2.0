<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 校内网 2.0 学习版</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <style>
    /* ============================================================
       基础
       ============================================================ */
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ============================================================
       顶部导航
       ============================================================ */
    .nav {
      height: var(--nav-h);
      background: var(--card);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 32px;
      gap: 26px;
    }

    .nav .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      color: var(--ink);
      text-decoration: none;
    }

    .logo .mark {
      width: 28px;
      height: 28px;
      border-radius: var(--r-sm);
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .nav a {
      color: var(--ink-2);
      text-decoration: none;
    }

    .nav a.on {
      color: var(--brand);
      font-weight: 600;
    }

    .search {
      flex: 1;
      max-width: 400px;
      margin-left: auto;
      position: relative;
    }

    .search input {
      width: 100%;
      height: 36px;
      border-radius: var(--r-pill);
      border: 1px solid var(--line);
      background: var(--bg);
      padding: 0 16px 0 40px;
      font-size: 13px;
      outline: none;
    }

    .search .mag {
      position: absolute;
      left: 14px;
      top: 9px;
      color: var(--ink-3);
    }

    /* 发帖按钮：原设计稿是 div，这里改成 button，需要去掉默认边框和字体 */
    .post {
      margin-left: auto;
      height: 36px;
      padding: 0 18px;
      border: none;
      border-radius: var(--r-pill);
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .school {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 13px;
      line-height: inherit;
      color: var(--ink-2);
      cursor: pointer;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: var(--r-pill);
      background: var(--card);
    }

    /* ============================================================
       两栏布局：左侧版块 + 右侧信息流
       ============================================================ */
    .wrap {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 24px 32px 64px;
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 24px;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 4px;
      height: fit-content;
      position: sticky;
      top: 80px;
    }

    .side .grp {
      font-size: 11px;
      color: var(--ink-3);
      padding: 10px 8px 4px;
      letter-spacing: .05em;
    }

    .side a {
      padding: 9px 14px;
      border-radius: var(--r-sm);
      color: var(--ink-2);
      text-decoration: none;
      font-size: 13.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .side a.on {
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 600;
    }

    .side .cnt {
      font-size: 11px;
      color: var(--ink-3);
      background: var(--bg);
      border-radius: var(--r-pill);
      padding: 0 8px;
    }

    /* ============================================================
       信息流头部
       ============================================================ */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .topbar .tabs {
      display: flex;
      gap: 6px;
    }

    .topbar .tab {
      font-size: 13px;
      padding: 6px 16px;
      border-radius: var(--r-pill);
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--ink-2);
      cursor: pointer;
    }

    .topbar .tab.on {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .topbar .sort {
      margin-left: auto;
      font-size: 12px;
      color: var(--ink-3);
      cursor: pointer;
    }

    /* ============================================================
       帖子卡片
       ============================================================ */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .postcard {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 16px 20px;
      cursor: pointer;
    }

    .postcard:hover {
      border-color: var(--brand);
    }

    .ph {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #EEF3FF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .ph .who {
      font-size: 13px;
      font-weight: 600;
    }

    .ph .when {
      font-size: 11.5px;
      color: var(--ink-3);
    }

    /* 版块标签 */
    .tag {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: var(--r-pill);
    }

    .t-2nd     { background: #FDF5E6; color: #C47F17; }
    .t-lost    { background: #FBEAF0; color: #993556; }
    .t-study   { background: #EEF3FF; color: #185FA5; }
    .t-club    { background: #E9F7EF; color: #0F9D58; }
    .t-carpool { background: #E1F5EE; color: #0F6E56; }
    .t-hole    { background: #F1EFE8; color: #5F5E5A; }

    .title {
      font-size: 15px;
      font-weight: 600;
      margin: 2px 0 6px;
    }

    .body {
      font-size: 13px;
      color: var(--ink-2);
    }

    .imgs {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .img {
      width: 84px;
      height: 84px;
      border-radius: var(--r-sm);
      background: linear-gradient(180deg, #F7F9FC, #EDF1F7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-3);
      font-size: 11px;
    }

    .foot {
      display: flex;
      gap: 20px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--ink-3);
    }

    .foot span {
      cursor: pointer;
    }

    .foot .hot {
      color: var(--danger);
    }
  </style>
</head>
<body>

  <!-- ===== 顶部导航 ===== -->
  <header class="site-header">
    <nav class="nav" aria-label="主导航">
      <a class="logo" href="index.html">
        <span class="mark" aria-hidden="true">校</span>
        校内网 2.0
      </a>
      <a href="index.html">首页</a>
      <a href="app-center.html">应用中心</a>
      <a href="exam-lib.html">真题库</a>
      <a href="community.html" class="on">校园社区</a>

      <div class="search">
        <span class="mag" aria-hidden="true">⌕</span>
        <input id="community-search" type="text" aria-label="搜索帖子" placeholder="搜帖子">
      </div>
      <button class="post" id="new-post-btn" type="button">＋ 发帖</button>
      <button class="school" type="button">🏫 加载中… ▾</button>
    </nav>
  </header>

  <!-- ===== 页面内容：左侧版块 + 右侧帖子 ===== -->
  <div class="wrap">

    <aside class="side">
      <div class="grp">版块</div>
      <div id="board-filters">
        <a href="#" class="on">🏷️ 全部</a>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <div class="tabs">
          <button class="tab on" type="button" data-sort="latest">最新</button>
          <button class="tab" type="button" data-sort="hot">热门</button>
        </div>
        <span class="sort" id="post-count">正在加载…</span>
      </div>

      <section class="feed" id="community-feed" aria-label="帖子列表">
        <div class="empty-state">正在加载帖子…</div>
      </section>
    </main>
  </div>

  <script type="module" src="assets/js/pages/community.js"></script>
</body>
</html>

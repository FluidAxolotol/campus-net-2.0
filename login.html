<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 校内网 2.0 学习版</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <style>
    /* ============================================================
       基础：整页垂直水平居中
       ============================================================ */
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       登录卡片
       ============================================================ */
    .card {
      width: 400px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 36px 40px;
      box-shadow: var(--shadow);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
      justify-content: center;
      margin-bottom: 6px;
    }

    .logo .mark {
      width: 32px;
      height: 32px;
      border-radius: var(--r-sm);
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .sub {
      text-align: center;
      color: var(--ink-3);
      font-size: 12.5px;
      margin-bottom: 26px;
    }

    /* ============================================================
       表单字段
       ============================================================ */
    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      color: var(--ink-2);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      background: #fff;
      box-sizing: border-box;
    }

    .field input:focus {
      border-color: var(--brand);
    }

    /* “记住我” + “忘记密码” 左右分布 */
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: -4px 0 16px;
      font-size: 12.5px;
    }

    .row label {
      color: var(--ink-2);
      display: flex;
      gap: 6px;
      align-items: center;
      cursor: pointer;
    }

    .row a {
      color: var(--brand);
      text-decoration: none;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: var(--r-md);
      background: var(--brand);
      color: #fff;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .alt {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--ink-2);
    }

    .alt a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }

    /* 分隔线：用伪元素在文字两侧各画一条线 */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: var(--ink-3);
      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .adminlink {
      display: block;
      text-align: center;
      font-size: 12px;
      color: var(--ink-3);
      padding: 10px;
      border: 1px dashed var(--line);
      border-radius: var(--r-md);
      text-decoration: none;
    }

    .adminlink b {
      color: var(--ink-2);
    }

    .adminlink:hover {
      border-color: var(--ink-2);
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="logo">
      <span class="mark" aria-hidden="true">校</span>
      校内网 2.0
    </div>
    <div class="sub">登录后可上传真题、发帖、收藏</div>

    <form action="#">
      <div class="field">
        <label for="account">学号 / 邮箱</label>
        <input id="account" type="text" placeholder="请输入学号或邮箱">
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="请输入密码">
      </div>

      <div class="row">
        <label>
          <input type="checkbox" checked>
          记住我
        </label>
        <a href="forgot-password.html">忘记密码？</a>
      </div>

      <button class="btn" type="submit">登 录</button>
    </form>

    <div class="alt">还没有账号？<a href="register.html">注册</a></div>

    <div class="divider">我是管理员</div>
    <a class="adminlink" href="admin-console.html">🛠 管理后台独立入口 <b>›</b></a>
  </main>

</body>
</html>

# ============================================================
# 一键本地全栈：MySQL 8 + Express + Nginx
# 启动：docker compose up --build
# 访问：http://localhost:8088/
# 说明：本文件使用 NODE_ENV=development，Cookie 不加 Secure，
#       以便在 http://localhost 演示。生产请用 deploy/ 下的配置。
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: campus2-mysql
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_change_me
      MYSQL_DATABASE: campus2
      MYSQL_USER: campus2
      MYSQL_PASSWORD: campus2_pass
    ports:
      - "3308:3306"
    volumes:
      - campus2_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucampus2 -pcampus2_pass --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./server
    container_name: campus2-api
    environment:
      NODE_ENV: development
      PORT: 3100
      PUBLIC_ORIGIN: http://localhost:8088
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: campus2
      DB_USER: campus2
      DB_PASSWORD: campus2_pass
      SESSION_SECRET: docker-dev-user-session-secret-please-change-123456789
      ADMIN_SESSION_SECRET: docker-dev-admin-session-secret-please-change-987654321
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_USERNAME: campusadmin
      ADMIN_DISPLAY_NAME: 平台管理员
      ADMIN_DEFAULT_PASSWORD: Admin@2026
      SEED_USER_PASSWORD: Student@2026
      UPLOAD_DIR: ./uploads
      USE_X_ACCEL: "false"
      RATE_LIMIT_DISABLED: "0"
    command: sh -c "npm run migrate && npm run seed && npm start"
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: campus2-nginx
    ports:
      - "8088:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/nginx/campus2.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/uploads:/srv/campus2/uploads:ro
    depends_on:
      - api

volumes:
  campus2_mysql_data:

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>忘记密码 · 校内网 2.0 学习版</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <style>
    /* ============================================================
       基础：整页垂直水平居中
       ============================================================ */
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       卡片
       ============================================================ */
    .card {
      width: 400px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 36px 40px;
      box-shadow: var(--shadow);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
      justify-content: center;
      margin-bottom: 6px;
    }

    .logo .mark {
      width: 32px;
      height: 32px;
      border-radius: var(--r-sm);
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .sub {
      text-align: center;
      color: var(--ink-3);
      font-size: 12.5px;
      margin-bottom: 22px;
    }

    /* ============================================================
       步骤条
       ============================================================ */
    .steps {
      display: flex;
      gap: 0;
      margin: 0 0 24px;
      padding: 0;
      list-style: none;
    }

    .step {
      flex: 1;
      text-align: center;
      font-size: 11px;
      color: var(--ink-3);
      position: relative;
    }

    .step .dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--line);
      color: var(--ink-3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .step.on .dot {
      background: var(--brand);
      color: #fff;
    }

    .step.done .dot {
      background: var(--brand-soft);
      color: var(--brand);
    }

    .step.on {
      color: var(--brand);
      font-weight: 600;
    }

    /* ============================================================
       表单字段
       ============================================================ */
    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      color: var(--ink-2);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      background: #fff;
      box-sizing: border-box;
    }

    .field input:focus {
      border-color: var(--brand);
    }

    /* 只读字段 */
    .field .ro {
      background: var(--bg);
      color: var(--ink-2);
    }

    /* 验证码行 */
    .vrow {
      display: flex;
      gap: 10px;
    }

    .vrow input {
      flex: 1;
    }

    .vbtn {
      height: 44px;
      padding: 0 16px;
      border: 1px solid var(--brand);
      border-radius: var(--r-md);
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ============================================================
       按钮
       ============================================================ */
    .btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: var(--r-md);
      background: var(--brand);
      color: #fff;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink-2);
      margin-top: 10px;
      font-weight: 400;
    }

    .alt {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--ink-2);
    }

    .alt a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="logo">
      <span class="mark" aria-hidden="true">校</span>
      校内网 2.0
    </div>
    <div class="sub">找回密码</div>

    <!-- 步骤条：done = 已完成，on = 当前步骤 -->
    <ol class="steps" aria-label="找回密码步骤">
      <li class="step done">
        <div class="dot">✓</div>
        验证邮箱
      </li>
      <li class="step on" aria-current="step">
        <div class="dot">2</div>
        重设密码
      </li>
      <li class="step">
        <div class="dot">3</div>
        完成
      </li>
    </ol>

    <form action="#">
      <div class="field">
        <label for="email">校园邮箱</label>
        <input id="email" class="ro" type="text" value="lexin@mail.sysu.edu.cn" readonly>
      </div>

      <div class="field">
        <label for="code">验证码</label>
        <div class="vrow">
          <input id="code" type="text" placeholder="6 位验证码">
          <button class="vbtn" type="button">重新发送</button>
        </div>
      </div>

      <div class="field">
        <label for="new-password">新密码</label>
        <input id="new-password" type="password" placeholder="8–20 位，含字母和数字">
      </div>

      <div class="field">
        <label for="confirm-password">确认新密码</label>
        <input id="confirm-password" type="password" placeholder="再输入一次">
      </div>

      <button class="btn" type="submit">重设密码</button>
      <button class="btn ghost" type="button">上一步</button>
    </form>

    <div class="alt">想起来了？<a href="login.html">直接登录</a></div>
  </main>

</body>
</html>
